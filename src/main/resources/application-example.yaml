server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: lax
        secure: false  # cambiar a true en producción con HTTPS

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://localhost:3306/auth_and_user
    username: root
    password: YOUR_DB_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "YOUR_GOOGLE_CLIENT_ID"
            client-secret: "YOUR_GOOGLE_CLIENT_SECRET"
            scope:
              - email
              - profile
            redirect-uri: "http://localhost:8080/login/oauth2/code/google"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: YOUR_EMAIL@gmail.com
    password: YOUR_APP_PASSWORD  # contraseña de aplicación de Google, no la del correo
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        service-name: auth-service
        health-check-path: /actuator/health
        health-check-interval: 10s

jwt:
  secret: YOUR_JWT_SECRET_BASE64          # clave Base64 de mínimo 256 bits
  expiration: 900000                       # 15 minutos — access token (siempre fijo)
  refresh-expiration: 604800000            # 7 días — refresh token con "Recuérdame" activo

management:
  health:
    mail:
      enabled: false                       # evita que el health check falle si el SMTP no responde
  endpoints:
    web:
      exposure:
        include: health,info

app:
  frontend-url: http://localhost:4200
  max-login-attempts: 5                    # intentos fallidos antes de enviar alerta de seguridad

logging:
  level:
    org.springframework.security: DEBUG
    com.auth: DEBUG
    org.springframework.web: DEBUG